# Trend Radar signal sources — keyword searches over community + news sources.
#
# Every source is free. No key needed: Hacker News (Algolia), Google News RSS,
# GitHub search, DEV (dev.to), Lobsters. Skipped until their key is set:
# YouTube (YOUTUBE_API_KEY), Bluesky (BLUESKY_HANDLE + BLUESKY_APP_PASSWORD),
# Threads (THREADS_ACCESS_TOKEN). The pipeline runs 4×/day; request counts
# below are per run. GitHub, DEV, Lobsters and Bluesky re-read the whole
# window each run (their stars/likes keep moving and it is only a few requests).

# Topics are built from signals published in the last N days
window_days: 14
# After the first (backfill) run, each run only re-fetches the last N days,
# which also refreshes points/comments on recent posts
refresh_overlap_days: 2

hn:
  enabled: true
  min_points: 3          # stories below this are mostly unread
  ask_min_points: 1      # Ask HN threads are the "what people ask" signal; keep more of them
  hits_per_page: 100
  max_pages: 5           # per query and tag; only the backfill run needs more than one
  queries:               # ~1 request per query × 2 tags in a steady-state run
    - LLM
    - OpenAI
    - Anthropic
    - Claude
    - Gemini
    - GPT
    - DeepSeek
    - Llama
    - Mistral
    - Qwen
    - AI agent
    - AI coding
    - AI regulation
    - AI safety

gnews:
  enabled: true
  hl: en-US
  gl: US
  ceid: "US:en"
  queries:               # 1 request each; Google News returns at most 100 items per query
    - OpenAI
    - Anthropic
    - Google Gemini
    - DeepSeek
    - AI agent
    - AI regulation
    - AI startup funding
    - open source AI model

youtube:
  enabled: true          # still skipped while YOUTUBE_API_KEY is unset
  # Daily quota is 10,000 units: search.list = 100, videos.list = 1.
  # 4 runs × (5 searches + 5 stats calls) ≈ 2,020 units/day.
  max_units_per_run: 600
  max_results: 25
  queries:
    - AI agent
    - Claude AI
    - ChatGPT
    - Gemini AI
    - AI coding

github:
  enabled: true
  min_stars: 100         # new repos below this are mostly noise
  per_page: 50
  queries:               # 1 unauthenticated search request each (limit: 10/min)
    - topic:llm
    - topic:ai-agents
    - topic:mcp

devto:
  enabled: true
  min_reactions: 10
  per_page: 50
  tags:                  # 1 request each: the tag's top posts over the window
    - ai
    - llm
    - machinelearning

lobsters:
  enabled: true
  min_score: 3
  max_pages: 3           # newest stories first; stops at the window start
  tags:
    - ai
    - vibecoding

bluesky:
  enabled: true          # still skipped while BLUESKY_HANDLE / BLUESKY_APP_PASSWORD are unset
  min_likes: 10
  limit: 100
  lang: en
  queries:               # 1 request each (sort=top over the window)
    - LLM
    - OpenAI
    - Anthropic Claude
    - Gemini
    - AI agent
    - AI safety

threads:
  enabled: true          # still skipped while THREADS_ACCESS_TOKEN is unset
  limit: 50
  queries:               # 1 request each; quota is 2,200 queries/24h per user
    - OpenAI
    - Claude AI
    - Gemini AI
    - AI agent
